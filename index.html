<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0713">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pokémon Unite · Doll House</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <h1>Pokémon Unite · Draft</h1>
  <div class="sub">Modo Libre · Picks y Bans manuales</div>
</header>

<!-- Panel de instrucciones -->
<section class="controls">
  <div class="controls-header">
    <span class="controls-label">🖐 MODO LIBRE  COMO LA VIDA DE MOA</span>
    <button class="reset-btn" id="clearBtn">↻ Limpiar</button>
  </div>
  <div class="free-hint">
    <span class="step">1</span> Toca un Pokémon para armarlo.
    <span class="step">2</span> Toca la casilla destino (pick o ban).
    <span class="step">3</span> Toca una casilla ocupada para vaciarla.
  </div>
</section>

<!-- Arena: equipos, slots y bans -->
<main class="arena" id="arena"></main>

<!-- Pool de Pokémon -->
<section class="pool-wrap">
  <div class="pool-bar">
    <div class="filters" id="filters">
      <div class="filter on" data-role="all">Todos</div>
      <div class="filter" data-role="Attacker">Attacker</div>
      <div class="filter" data-role="Defender">Defender</div>
      <div class="filter" data-role="All-Rounder">All-Rounder</div>
      <div class="filter" data-role="Speedster">Speedster</div>
      <div class="filter" data-role="Supporter">Supporter</div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<!-- Scripts: el orden importa -->
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
